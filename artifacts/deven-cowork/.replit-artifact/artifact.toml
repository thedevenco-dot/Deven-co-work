kind = "web"
previewPath = "/"
title = "Deven Cowork"
description = "A premium conversion-focused website for Deven Cowork, a modern business club and growth workspace in City Centre, Raipur, helping founders, teams, and independent professionals find their next place to build."
version = "1.0.0"
id = "artifacts/deven-cowork"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23281

[services.development]
run = "pnpm --filter @workspace/deven-cowork run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deven-cowork", "run", "build" ]
serve = "static"
publicDir = "artifacts/deven-cowork/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23281"
BASE_PATH = "/"
